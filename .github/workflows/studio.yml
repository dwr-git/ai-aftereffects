# Сборка AI-After Effects: готовая папка для сервера (zip).
#
# Запускается на каждое изменение ветки main и вручную (Actions → «Сборка» → Run workflow).
# Результат:
#   - Releases → «Сборка N — дата» (отдельный выпуск на каждую сборку, свежая отмечена Latest):
#     ai-aftereffects-build-N-ГГГГ-ММ-ДД.zip; что нового — из studio/CHANGES.ru.md
#   - Actions → запуск → Artifacts: тот же zip
# Rust, wasm-bindgen и всё остальное ставятся только здесь, на машине GitHub. На ваш сервер
# попадают готовые файлы: index.html, js, сжатый wasm, шрифты, PHP помощника.
name: Сборка

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-build
  cancel-in-progress: true

jobs:
  build:
    name: AI-After Effects (браузер)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WASM_BINDGEN_VERSION: 0.2.129
      AI_AFTEREFFECTS_BUILD: ${{ github.run_number }}
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Шрифты-двойники
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
          mkdir -p "$RUNNER_TEMP/fonts"
          # Liberation (метрики Times New Roman, Arial, Courier New), Carlito (Calibri), Caladea (Cambria).
          for f in $(fc-list -f '%{file}\n' | grep -E '/(liberation|crosextra)/.*\.ttf$' | sort -u); do cp "$f" "$RUNNER_TEMP/fonts/"; done
          cp /usr/share/doc/fonts-liberation/copyright "$RUNNER_TEMP/fonts/LICENSE-Liberation.txt"
          cp /usr/share/doc/fonts-crosextra-carlito/copyright "$RUNNER_TEMP/fonts/LICENSE-Carlito.txt"
          cp /usr/share/doc/fonts-crosextra-caladea/copyright "$RUNNER_TEMP/fonts/LICENSE-Caladea.txt"
          ls -la "$RUNNER_TEMP/fonts"
          test "$(ls "$RUNNER_TEMP"/fonts/*.ttf | wc -l)" -ge 12

      - name: Rust для WebAssembly
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Кэш сборки
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: studio-web
          cache-on-failure: true

      - name: Установить wasm-bindgen
        run: |
          set -e
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          if curl --proto '=https' -fsSL "$url" -o wb.tgz; then
            tar -xzf wb.tgz
            install "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
          else
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
          fi
          wasm-bindgen --version

      - name: Проверить PHP помощника
        run: for f in studio/api/*.php; do php -l "$f"; done

      - name: Проверить JavaScript панели
        run: for f in studio/web/*.js; do node --check "$f"; done

      - name: Собрать сайт
        run: |
          export AI_AFTEREFFECTS_FONTS_DIR="$RUNNER_TEMP/fonts"
          studio/build/package.sh

      - name: Сохранить zip в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-aftereffects
          path: dist/release/ai-aftereffects-build-*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Выложить в Releases (отдельная сборка с номером)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(ls dist/release/ai-aftereffects-build-*.zip)
          DATE=$(TZ=Europe/Minsk date +%d.%m.%Y)
          # Что нового: верхний раздел studio/CHANGES.ru.md (от первого «## » до следующего).
          awk '/^## /{n++} n==1' studio/CHANGES.ru.md > notes.md
          {
            echo
            echo "---"
            echo "Скачайте zip ниже, распакуйте и положите папку ai-aftereffects на сервер вместо старой (имя папки можно менять)."
            echo "Номер установленной сборки виден в шапке панели помощника. Инструкция: studio/README.ru.md"
          } >> notes.md
          # Повторный запуск той же сборки заменяет её выпуск.
          gh release delete "build-${AI_AFTEREFFECTS_BUILD}" --cleanup-tag --yes 2>/dev/null || true
          gh release create "build-${AI_AFTEREFFECTS_BUILD}" "$ZIP" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Сборка ${AI_AFTEREFFECTS_BUILD} — ${DATE}" \
            --notes-file notes.md
